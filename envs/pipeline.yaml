# Conda environment for the oral virome pipeline.
#
# Versions are pinned. envs/pipeline.lock.yaml and envs/pipeline.explicit.txt
# hold the fully resolved dependency set from a working install; use those for
# exact reproduction. Regenerate them with:
#   conda env export -n oral-virome --no-builds > envs/pipeline.lock.yaml
#   conda list -n oral-virome --explicit    > envs/pipeline.explicit.txt
#
# All packages resolve natively on osx-arm64, so no Rosetta translation is
# needed on Apple Silicon. They also resolve on linux-64 for CI.
name: oral-virome
channels:
  - conda-forge
  - bioconda
dependencies:
  # workflow
  - python=3.12
  - snakemake-minimal=9.27.0

  # data retrieval and subsampling
  - sra-tools=3.4.1
  - seqtk=1.5
  - pigz

  # QC and preprocessing
  - fastqc=0.12.1
  - fastp=1.3.7
  - multiqc=1.35

  # alignment and counting
  - bowtie2=2.5.5
  - minimap2=2.31
  - samtools

  # python analysis and tests
  - pandas
  - pytest

  # statistics
  - r-base=4.4
  - r-vegan
  - r-tidyverse
  - r-patchwork
